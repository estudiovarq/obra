<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VARQ · Tu obra</title>
<!-- "Puerta" del Estudio VARQ: le da a la página de obra un ícono propio en el celular.
     La página de verdad sigue en Google (Apps Script); esto sólo la muestra en pantalla completa. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VARQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin:0; height:100%; background:#f7f3ec; font-family:-apple-system, system-ui, sans-serif; color:#23201c; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #espera { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #espera img { width:120px; height:120px; border-radius:26px; }
  #espera a { color:#23201c; font-size:14px; }
</style>
</head>
<body>
<div id="espera"><img src="icon-192.png" alt="VARQ"><div>Abriendo tu obra…</div><a id="aparte" href="#">¿No abre? Tocá acá</a></div>
<script>
  // Dirección de la página (Implementar → Gestionar implementaciones → URL de la app web)
  var PAGINA = 'https://script.google.com/macros/s/AKfycbzdsF6Sv_PDOcH488_9Hhlfe9dubfIlRo9TBXy0Q77RECIkMVAM6eJoiEac6uNjQF3o0Q/exec';

  // El link personal trae ?k=CLAVE. Se guarda acá por si el ícono se abre sin ella.
  var k = (location.search.match(/[?&]k=([A-Za-z0-9]+)/) || [])[1] || '';
  try { if (k) localStorage.setItem('varq_k', k); else k = localStorage.getItem('varq_k') || ''; } catch (e) {}
  var url = PAGINA + (k ? '?k=' + k : '');
  document.getElementById('aparte').href = url;

  var f = document.createElement('iframe');
  f.src = url; f.allow = 'clipboard-write; fullscreen';
  f.onload = function () { document.getElementById('espera').style.display = 'none'; };
  document.body.appendChild(f);
</script>
</body>
</html>
